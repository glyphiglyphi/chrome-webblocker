<!DOCTYPE html>
<html>
<head>
  <title>FocusGuard Settings</title>
  <style>
    body { font-family: sans-serif; width: 350px; padding: 10px; font-size: 14px; }
    h3 { margin-top: 15px; margin-bottom: 5px; border-bottom: 1px solid #ccc; padding-bottom: 3px; }
    h3:first-child { margin-top: 0; }
    ul { list-style-type: none; padding-left: 0; margin-top: 5px; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #eee; }
    li:last-child { border-bottom: none; }
    li button { margin-left: 10px; padding: 3px 8px; }
    .input-group { display: flex; margin-bottom: 10px; align-items: center; }
    .input-group input[type="text"] { flex-grow: 1; margin-right: 5px; padding: 5px; }
    .input-group button { padding: 5px 10px; }
    .settings-section { margin-bottom: 15px; }
    .settings-section label { display: block; margin-bottom: 3px; font-weight: bold; }
    .settings-section input[type="number"] { width: 60px; padding: 4px; margin-right: 5px; }
    .quota-info p { margin: 4px 0; }
    .toggle-switch { display: flex; align-items: center; justify-content: space-between; margin-top:10px; padding: 5px; background-color: #f0f0f0; border-radius: 5px;}
    .toggle-switch label { font-weight: bold; }
    /* Basic toggle switch styling */
    .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #2196F3; }
    input:checked + .slider:before { transform: translateX(26px); }
    #saveStatus { font-style: italic; color: green; margin-top: 5px; height: 1em; }
  </style>
</head>
<body>

  <div class="toggle-switch">
    <label for="extensionEnabledToggle">Extension Enabled</label>
    <label class="switch">
      <input type="checkbox" id="extensionEnabledToggle">
      <span class="slider"></span>
    </label>
  </div>

  <h3>Quota Settings</h3>
  <div class="settings-section">
    <div>
      <label for="dailyQuotaInput">Daily Quota (minutes)</label>
      <input type="number" id="dailyQuotaInput" min="0">
    </div>
    <div>
      <label for="hourlyCapInput">Hourly Cap (minutes per hour)</label>
      <input type="number" id="hourlyCapInput" min="0">
    </div>
    <button id="saveQuotaSettingsBtn">Save Quotas</button>
    <p id="saveStatus"></p>
  </div>

  <h3>Quota Usage</h3>
  <div class="quota-info">
    <p><b>Daily:</b> <span id="dailyUsed">0</span> / <span id="dailyTotal">0</span> min used (<span id="dailyRemaining">0</span> min left)</p>
    <p><b>Current Hour:</b> <span id="hourlyUsed">0</span> / <span id="hourlyTotalCap">0</span> min used (<span id="hourlyRemaining">0</span> min left)</p>
  </div>

  <h3>Blocked Websites</h3>
  <div class="input-group">
    <input type="text" id="newDomain" placeholder="e.g., example.com">
    <button id="addDomainBtn">Add</button>
  </div>
  <ul id="blockedDomainsList">
    <!-- Domains will be listed here -->
  </ul>

  <script src="popup.js"></script>
</body>
</html>
